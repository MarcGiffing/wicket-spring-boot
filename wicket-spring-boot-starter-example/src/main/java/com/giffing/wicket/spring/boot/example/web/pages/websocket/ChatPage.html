<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org" lang="en">
<head>
	<meta charset="utf-8"/>
	<title>Chat</title>
</head>
<body>
<wicket:extend>
	<!-- Header -->
	<header class="py-4 bg-light border-bottom mb-4">
		<div class="container">
			<h1 class="h3 mb-0">Chat</h1>
		</div>
	</header>
	<div class="container">
		<!-- Feedback -->
		<div wicket:id="feedback"></div>

		<form wicket:id="form">
			<div class="row justify-content-center">
				<div class="col-lg-8">
					<!-- Chat Card -->
					<div class="card shadow-sm">
						<!-- Header / Controls -->
						<div class="card-header bg-white">
							<!-- Participants -->
							<div class="input-group input-group-sm mb-2">
								<button class="btn btn-outline-secondary" type="button">
									<i class="fa-solid fa-user"></i>
								</button>

								<select wicket:id="participants"
										class="form-select form-select-sm">
								</select>
							</div>

							<!-- Message input -->
							<div class="input-group input-group-sm">
								<button class="btn btn-outline-secondary" type="button">
									<i class="fa-solid fa-pen"></i>
								</button>

								<input wicket:id="message"
									   type="text"
									   class="form-control"
									   placeholder="Type your message here..."/>

								<button class="btn btn-primary"
										wicket:id="submit">
									<i class="fa-solid fa-paper-plane"></i>
								</button>
							</div>
						</div>

						<!-- Messages -->
						<div class="card-body"
							 wicket:id="chatMessageContainer"
							 style="height: 60vh; overflow-y: auto;">
							<div wicket:id="messages"
								 class="d-flex flex-column gap-2">
								<div class="d-flex">
									<div class="px-3 py-2 small rounded-3 bg-light">
										<strong>
											<span wicket:id="from"></span>
										</strong>:
										<span wicket:id="message"></span>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</form>
	</div>
</wicket:extend>
</body>
</html>
